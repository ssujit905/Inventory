# fly.toml - Fly.io deployment config for Pasale Chatbot
app = "pasale-chatbot"
primary_region = "sin"  # Singapore - closest to Nepal

[build]
  # Fly auto-detects Node.js via package.json

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false   # NEVER sleep - always on 24/7
  auto_start_machines = true
  min_machines_running = 1     # Always keep at least 1 machine alive

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
